name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test:coverage
      - name: Test the source compiled with React Compiler
        run: bun run test:compiler
      - run: bun run build
      - run: bun run size
      - name: React Compiler report
        run: bun run compiler
      - name: React Doctor
        run: bun run doctor

  react-18:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun add --dev react@18 react-dom@18
      - run: bun run test
