name: Publish

on:
  workflow_dispatch:
    inputs:
      release:
        description: Version bump
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Bump version
        # `preversion` runs all checks.
        run: |
          git config user.name "Dogu Yilmaz"
          git config user.email "dogukyilmaz@gmail.com"
          npm version "$RELEASE" -m "Bump version to v%s"
        env:
          RELEASE: ${{ inputs.release }}
      - name: Publish
        # Trusted publishing (OIDC) authenticates and adds provenance. `prepublishOnly` builds the package.
        run: npm publish --access public
      - run: git push --follow-tags
      - name: GitHub release
        # Release notes are the version's CHANGELOG section.
        run: |
          version=$(node -p "require('./package.json').version")
          awk -v v="## $version " 'index($0, v) == 1 { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md
          gh release create "v$version" --title "v$version" --notes-file notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
