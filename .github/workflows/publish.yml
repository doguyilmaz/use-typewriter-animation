name: Publish

on:
  workflow_dispatch:
    inputs:
      release:
        description: Version bump
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - name: Bump version
        # `preversion` runs all checks, `postversion` pushes the commit and the tag.
        run: |
          git config user.name "Dogu Yilmaz"
          git config user.email "dogukyilmaz@gmail.com"
          npm version ${{ inputs.release }} -m "Bump version to v%s"
      - name: Publish
        # `prepublishOnly` builds the package.
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
